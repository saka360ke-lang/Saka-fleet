# Saka Fleet - deploy the landing/ marketing site to Hostinger shared hosting.
# Ships ONLY static files; the backend repo never reaches Hostinger.
# Self-skips (with a green run) until HOSTINGER_FTP_* secrets exist.
# Note: the secrets context is available in STEPS only, never in a job-level
# if - the guard below is deliberately a step output check.

name: Deploy Landing to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy_landing.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Hostinger FTP secrets exist
        id: guard
        shell: bash
        run: |
          if [ -z "${{ secrets.HOSTINGER_FTP_SERVER }}" ] || [ -z "${{ secrets.HOSTINGER_FTP_USERNAME }}" ] || [ -z "${{ secrets.HOSTINGER_FTP_PASSWORD }}" ]; then
            echo "HOSTINGER_FTP_* secrets are not configured yet - skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy landing/ via FTP
        if: steps.guard.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./landing/
          exclude: |
            **/.DS_Store
            **/.git*
            **/*.md
          dangerous-clean-slate: false

