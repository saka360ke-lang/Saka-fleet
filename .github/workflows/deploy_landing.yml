# Saka Fleet - deploy the landing/ marketing site to Hostinger shared hosting.
# Ships ONLY static files; the backend repo never reaches Hostinger.
# Self-skips until HOSTINGER_FTP_* secrets exist (see docs/LANDING_DEPLOYMENT.md).

name: Deploy Landing to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy_landing.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.HOSTINGER_FTP_SERVER != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy landing/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./landing/
          exclude: |
            **/.DS_Store
            **/.git*
            **/*.md
          dangerous-clean-slate: false
