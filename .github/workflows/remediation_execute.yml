name: Autonomous Remediation Execute (Cline)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      mode:
        description: 'execute'
        required: true
        default: 'execute'
      proposal_code:
        description: 'proposal code'
        required: false
      approval_nonce:
        description: 'approval nonce'
        required: false

permissions:
  contents: write

concurrency: remediation-execute

jobs:
  execute:
    if: |
      (github.event_name == 'repository_dispatch' && github.event.action == 'remediation_execute') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'execute')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPERADMIN_PHONE: ${{ secrets.SUPERADMIN_PHONE }}
      SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
      META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
      META_WHATSAPP_TOKEN: ${{ secrets.META_WHATSAPP_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PROPOSAL_CODE: ${{ github.event.client_payload.proposal_code || github.event.inputs.proposal_code }}
      APPROVAL_NONCE: ${{ github.event.client_payload.approval_nonce || github.event.inputs.approval_nonce }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Gate - verify Superadmin approval nonce
        run: |
          node scripts/remediation_ci.js gate "$PROPOSAL_CODE" "$APPROVAL_NONCE"
          echo "GATE_PASSED=true" >> "$GITHUB_ENV"

      - name: Resolve targeted test suites
        run: |
          TESTS=$(node scripts/remediation_ci.js tests "$PROPOSAL_CODE")
          test -n "$TESTS"
          echo "TESTS=$TESTS" >> "$GITHUB_ENV"

      - name: Pre-change test pass
        run: node scripts/run_tests.js $TESTS

      - name: Smoke end
        run: echo "bisect A ok"
