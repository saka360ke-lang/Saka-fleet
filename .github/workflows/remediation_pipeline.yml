name: Autonomous Remediation (Cline)

# Triggered ONLY by the Saka backend (repository_dispatch) or manually
# (workflow_dispatch). There is deliberately no push/pull_request trigger:
# a human Superadmin approval in Supabase is the only route to execute.

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan | execute'
        required: true
        default: 'plan'
      audit_run_id:
        description: 'sentinel_audit_runs id or run_date (plan mode)'
        required: false
      proposal_code:
        description: 'remediation_proposals.proposal_code (execute mode)'
        required: false
      approval_nonce:
        description: 'Single-use approval nonce (execute mode)'
        required: false

permissions:
  contents: write

concurrency: remediation-pipeline

jobs:
  plan:
    if: |
      (github.event_name == 'repository_dispatch' && github.event.action == 'remediation_plan') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'plan')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPERADMIN_PHONE: ${{ secrets.SUPERADMIN_PHONE }}
      SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
      META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
      META_WHATSAPP_TOKEN: ${{ secrets.META_WHATSAPP_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AUDIT_RUN_ID: ${{ github.event.client_payload.audit_run_id || github.event.inputs.audit_run_id }}
      MODIFY_FEEDBACK: ${{ github.event.client_payload.feedback || '' }}
      CLUSTER_SIGNATURE: ${{ github.event.client_payload.cluster_signature || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check CI secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL / SUPABASE_SERVICE_KEY repository secrets. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare audit context
        run: |
          mkdir -p remediation/work-orders
          node scripts/remediation_ci.js fetch-audit "$AUDIT_RUN_ID" "$MODIFY_FEEDBACK" "$CLUSTER_SIGNATURE" > remediation/audit-context.json
          test -s remediation/audit-context.json

      - name: Install Cline CLI
        run: npm install -g cline

      - name: Draft remediation plan with Cline (headless)
        run: |
          cline --auto-approve true -t 1800 -P deepseek -m deepseek-chat "You are Cline drafting a remediation plan for Saka Fleet inside CI. Read .clinerules and SAKA_FLEET_ARCHITECTURE.md completely first. Then read remediation/audit-context.json (Sentinel audit of the rolling window). When cluster_signature is present, focus the plan on that cluster and ignore unrelated clusters. Explore only the code needed to write a precise, minimal plan. Write ONE JSON file to remediation/work-orders/plan.json using the plan_schema from the context. Hard rules: at most 12 changes; repository-relative paths; at least one existing root-level test_*.js suite; never target any forbidden_paths entry; descriptive plan only (no code edits, no SQL, no schema changes); incorporate modify_feedback if present. Do not create any other files." > remediation/cline-plan.log 2>&1 || true
          test -f remediation/work-orders/plan.json

      - name: Submit plan (guardrail-sanitized)
        run: node scripts/remediation_ci.js submit-plan "$AUDIT_RUN_ID" remediation/work-orders/plan.json "$CLUSTER_SIGNATURE"

      - name: Upload plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-plan-${{ github.run_id }}
          path: |
            remediation/audit-context.json
            remediation/work-orders/plan.json
            remediation/cline-plan.log
          if-no-files-found: warn

